<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/script.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <div class="logo">
            <h2>Melody Rush</h2>
        </div>
        <nav class="menu">
            <a href="index.html">Home</a>
            <span>|</span>
            <a href="#">Productos</a>
            <span>|</span>
            <a href="#">Nosotros</a>
            <span>|</span>
            <a href="#">Blogs</a>
            <span>|</span>
            <a href="#">Contacto</a>
        </nav>
        <div class="carrito">
            🛒 cart (0)
        </div>
    </header>

    <main class="registro">
        <form class="formulario" id="formRegistro" novalidate>
            <h3>Registro de usuario</h3>
            <label for="nombreRegistro">NOMBRE COMPLETO</label>
            <input type="text" id="nombreRegistro" name="nombre">

            <label for="correoRegistro">CORREO</label>
            <input type="email" id="correoRegistro" name="correo">

            <label for="correo2">CORREO</label>
            <input type="email" id="correo2" name="correo2">

            <label for="password">CONTRASEÑA</label>
            <input type="password" id="password" name="password">

            <label for="confirmar">CONFIRMAR CONTRASEÑA</label>
            <input type="password" id="confirmar" name="confirmar">

            <label for="telefono">TELEFONO (opcional)</label>
            <input type="tel" id="telefono" name="telefono">

            <div class="ubicacion">
                <div>
                    <select id="region">
                        <option>-- Seleccione la región --</option>
                        <option>Región Metropolitana de Santiago</option>
                        <option>Región de la Araucanía</option>
                        <option>Región de Ñuble</option>
                    </select>
                </div>

                <div>
                    <select id="comuna">
                        <option>-- Seleccione la comuna --</option>
                        <option>Linares</option>
                        <option>Longaví</option>
                        <option>Concepción</option>
                    </select>
                </div>
            </div>

            <button class="boton-registro" type="submit">
                REGISTRAR
            </button>
        </form>
    </main>
</body>
</html>
