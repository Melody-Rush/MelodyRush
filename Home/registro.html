<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Melody Rush</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/script.js" defer></script>
    <script src="js/registro.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="logo">
            <img src="../Home/img/Melody Rush.png" alt="Logo Melody Rush">
            <h2>Melody Rush</h2>
        </div>
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="../Productos/productos.html">Productos</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blog/noticias.html">Blogs</a>
            <a href="../Contactanos/contacto.html">Contacto</a>
      
        </nav>
        <div class="carrito">
            🛒 <a href="../Carrito/carrito.html">Carrito</a>
            <span class="badge" id="cart-count">0</span>
        </div>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main class="registro">
            
            <!-- novalidate evita los avisos feos por defecto del navegador -->
            <form class="formulario-registro" id="formRegistro" novalidate>
                <h3>Registro de usuario</h3>

                <label for="runRegistro">RUN</label>
                <input type="text" id="runRegistro" name="run" placeholder="12345678-K">
                <small class="mserror" id="errorRunRegistro"></small>

                <label for="nombreRegistro">Nombre</label>
                <input type="text" id="nombreRegistro" name="nombre" placeholder="Tu nombre">
                <small class="mserror" id="errorNombreRegistro"></small>
                    
                <label for="apellidosRegistro">Apellidos</label>
                <input type="text" id="apellidosRegistro" name="apellidos" placeholder ="Tus apellidos">
                <small class="mserror" id="errorApellidosRegistro"></small>

                <label for="correoRegistro">Correo Electrónico</label>
                <input type="email" id="correoRegistro" name="correo" placeholder="correo@duoc.cl">
                <small class="mserror" id="errorCorreoRegistro"></small>
                    
                <label for="fechaRegistro">Fecha de Nacimiento</label>
                <input type="date" id="fechaRegistro" name="fechaNacimiento">
                <small class="mserror" id="errorFechaRegistro"></small>
                    
                <label for="telefonoRegistro">Teléfono (opcional)</label>
                <input type="tel" id="telefonoRegistro" name="telefono" placeholder="+56 9 1234 5678">
                <small class="mserror" id="errorTelefonoRegistro"></small>

                <label for="passwordRegistro">Contraseña</label>
                <input type="password" id="passwordRegistro" name="password" placeholder="••••••••">
                <small class="mserror" id="errorPasswordRegistro"></small>
                    
                <label for="confirmarRegistro">Confirmar Contraseña</label>
                <input type="password" id="confirmarRegistro" name="confirmar" placeholder="••••••••">
                <small class="mserror" id="errorConfirmarRegistro"></small>
                
                <div class="ubicacion">
                    <div>
                        <label for="regionRegistro">Región</label>
                        <select id="regionRegistro" name="region">
                            <option value="">-- Seleccione la región --</option>
                            <option value="rm">Región Metropolitana</option>
                            <option value="valparaiso">Valparaíso</option>
                            <option value="biobio">Biobío</option>
                        </select>
                        <small class="mserror" id="errorRegionRegistro"></small>
                    </div>
                    <div>
                        <label for="comunaRegistro">Comuna</label>
                        <select id="comunaRegistro" name="comuna">
                            <option value="">-- Seleccione la comuna --</option>
                            <option value="santiago">Santiago</option>
                            <option value="providencia">Providencia</option>
                            <option value="maipu">Maipú</option>
                        </select>
                        <small class="mserror" id="errorComunaRegistro"></small>
                    </div>
                </div>

                <button type="submit" class="btn-auth">REGISTRAR</button>

                <div class="auth-footer">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                </div>
            </form>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-izq">
            <div class="superior-footer">
                <span class="site">Melody Rush</span>
            </div>
        </div>
        <div class="footer-der">
            <p class="textonews">Stay in Touch!</p>
        </div>
    </footer>
</body>
</html>
