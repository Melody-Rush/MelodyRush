<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Melody Rush</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ENCABEZADO -->
   <header class="encabezado">
        <div class="logo">
            <h2>Melody Rush</h2>
        </div>
        <nav class="menu">
            <a href="../Home/index.html" class="active">Home</a>
            <a href="../Productos/productos.html">Productos</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blog/noticias.html">Blogs</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="carrito">
            🛒 <span>Carrito</span>
            <span class="badge" id="cart-count">0</span>
        </div>
    </header>

    <!-- ACCESO LOGIN / REGISTRO -->
    <div class="acceso">
        <a href="login.html">Iniciar sesión</a>
        <span>|</span>
        <a href="registro.html">Registrarse</a>
    </div>

    
    <!-- BANNER PRINCIPAL (EL CUADRADO DESTACADO) -->
    <section class="home">
        <div class="home-texto">
            <h1>TIENDA ONLINE</h1>
            <p>Encuentra lo que buscas....</p>
            <a href="Productos/productos.html" class="boton-productos">⩢ ver productos</a>
        </div>
        <div class="principal-imagen">
            <img src="img/soda.webp" alt="Imagen principal"> 
        </div>
    </section>

    <!-- SECCIÓN DE PRODUCTOS DESTACADOS -->
    <section class="productos">
        <h2 class="text-center">PRODUCTOS DESTACADOS</h2>
        <!-- El JS inyecta los productos en este div -->
        <div class="grid-productos contenedor-productos" id="contenedor-productos">
            <!-- Se carga desde script.js -->
        </div>
    </section>
    
    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-izq">
            <div class="superior-footer">
                <span class="site">Melody Rush</span>
                <div class="pagos">
                    <div class="tarjeta">VISA</div>
                    <div class="tarjeta">MC</div>
                    <div class="tarjeta">AMEX</div>
                </div>
            </div>

            <div class="categorias-footer">
                <a href="#">Álbumes</a>
                <span>|</span>
                <a href="#">Vinilos</a>
                <span>|</span>
                <a href="#">Ofertas</a>
            </div>
        </div>
        <div class="footer-der">
            <p class="textonews">Escribe tu email para obtener noticias de nuestros productos.</p>
            <div class="newsletter">
                <input type="email" placeholder="Enter Email">
                <button type="button">Subscribe</button>
            </div>
        </div>
    </footer>

    <!-- Script en la carpeta JS -->
    <script src="js/script.js"></script>
</body>
</html>
