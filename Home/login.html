<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Melody Rush</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="logo">
            <h2>Melody Rush</h2>
        </div>
        <nav class="menu">
            <a href="../Home/index.html">Home</a>
            <a href="../Productos/productos.html">Productos</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blog/noticias.html">Blogs</a>
            <a href="../Contactanos/contacto.html">Contacto</a>
        </nav>
        <div class="carrito">
            🛒 <span>Carrito</span>
            <span class="badge" id="cart-count">0</span>
        </div>
    </header>

    <!-- FORMULARIO INICIO DE SESIÓN -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-title">Melody Rush</h1>
            <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>

            <!-- novalidate evita los avisos feos por defecto del navegador -->
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@duoc.cl">
                    <span class="error-msg" id="err-correo"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="error-msg" id="err-password"></span>
                </div>

                <button type="submit" class="btn-auth">Iniciar sesión</button>

                <div class="auth-footer">
                    ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-izq">
            <div class="superior-footer">
                <span class="site">Melody Rush</span>
            </div>
        </div>
        <div class="footer-der">
            <p class="textonews">Stay in Touch!</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
