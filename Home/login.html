<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Melody Rush</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/script.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <div class="logo">
            <img src="../Home/img/Melody Rush.png" alt="Logo Melody Rush">
            <h2>Melody Rush</h2>
        </div>
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="../Productos/productos.html">Productos</a>
            <a href="../nosotros/nosotros.html">Nosotros</a>
            <a href="../blog/noticias.html">Blogs</a>
            <a href="../Contactanos/contacto.html">Contacto</a>
          
        </nav>
        <div class="carrito">
            🛒 <span>Carrito</span>
            <span class="badge" id="cart-count">0</span>
        </div>
    </header>

    <!-- FORMULARIO INICIO DE SESIÓN -->
    <main class="login">
        <div class="logo-login">
            <img src="img/Melody Rush.png" alt="Logo de Melody Rush">
        </div>
        <h1 class="nombremp">Melody Rush</h1>
        <form class="formulario-login" id="formLogin" novalidate>
            <div class="titulo-login">
                Inicio de sesión
            </div>
            <div class="campos">
                <label for="correoLogin">CORREO</label>
                <input type="email" id="correoLogin" name="correo">
                <small class="mserror" id="errorCorreoLogin"></small>

                <label for="contrasenaLogin">CONTRASEÑA</label>
                <input type="password" id="contrasenaLogin" name="contrasena">
                <small class="mserror" id="errorContrasenaLogin"></small>
            </div>
            
            <button type="submit" class="btn-auth">Iniciar sesión</button>

            <div class="auth-footer">¿No tienes una cuenta? 
                <a href="registro.html">Regístrate aquí</a>
            </div>
            </form>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-izq">
            <div class="superior-footer">
                <span class="site">Melody Rush</span>
            </div>
        </div>
        <div class="footer-der">
            <p class="textonews">Stay in Touch!</p>
        </div>
    </footer>

</body>
</html>
